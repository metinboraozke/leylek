workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic > Team settings > Integrations > Developer Portal'daki isim
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.leylek.leylek
      # Backend hazır olunca açılacak. Boş kalırsa uygulama örnek veriyle çalışır.
      # vars:
      #   API_BASE_URL: https://backend-adresin.com
    scripts:
      - name: Paketleri indir
        script: flutter pub get

      - name: Uygulama ikonunu üret
        script: |
          if [ -f assets/icon/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            cat > flutter_launcher_icons.yaml <<EOF
          flutter_launcher_icons:
            image_path: "assets/icon/icon.png"
            ios: true
            android: true
            remove_alpha_ios: true
          EOF
            dart run flutter_launcher_icons
          else
            echo "assets/icon/icon.png yok, varsayılan ikon kullanılacak"
          fi

      - name: Şifreleme beyanı (TestFlight her seferinde sormasın)
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Runner/Info.plist

      - name: İmzalama profillerini uygula
        script: xcode-project use-profiles

      - name: IPA derle
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            ${API_BASE_URL:+--dart-define=API_BASE_URL=$API_BASE_URL} \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
